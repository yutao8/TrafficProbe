name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 编译所有脚本
        run: |
          python -m py_compile traffic_probe.py report_html.py tray.py tray_win.py
          echo "语法检查通过"
      - name: 跨平台目录逻辑自检
        run: |
          export TRAFFIC_PROBE_HOME="$RUNNER_TEMP/tp"
          python - <<'EOF'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("tp", "traffic_probe.py")
          tp = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tp)
          d = tp.data_dir()
          assert os.path.isdir(d), d
          assert d == os.environ["TRAFFIC_PROBE_HOME"], d
          print("data_dir ->", d)
          print("resolve_log ->", tp.resolve_log())
          print("OK")
          EOF

  build-windows:
    name: Windows exe
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: 打包
        run: |
          python -m PyInstaller --onefile --console --name TrafficProbe `
            --icon "${{ github.workspace }}\assets\trafficprobe.ico" `
            --add-data "${{ github.workspace }}\assets;assets" `
            --add-data "${{ github.workspace }}\report_html.py;." `
            --add-data "${{ github.workspace }}\tray.py;." `
            --add-data "${{ github.workspace }}\tray_win.py;." `
            --distpath dist --workpath build --specpath build `
            traffic_probe.py
      - name: 冒烟测试
        run: |
          python -c "import subprocess,sys; r=subprocess.run(['dist/TrafficProbe.exe','--help'],capture_output=True,text=True); print(r.stdout[:300]); sys.exit(r.returncode)"
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficProbe-windows-x64
          path: dist/TrafficProbe.exe
          if-no-files-found: error

  build-macos:
    name: macOS 可执行
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: 打包
        run: |
          python -m PyInstaller --onefile --console --name TrafficProbe \
            --add-data "assets:assets" \
            --add-data "report_html.py:." \
            --add-data "tray.py:." \
            --add-data "tray_win.py:." \
            --distpath dist --workpath build --specpath build \
            traffic_probe.py
      - name: 冒烟测试
        run: |
          ./dist/TrafficProbe --help | head -20
      - name: 打包成 tar.gz
        run: tar -czf TrafficProbe-macos.tar.gz -C dist TrafficProbe
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficProbe-macos
          path: TrafficProbe-macos.tar.gz
          if-no-files-found: error

  build-linux:
    name: Linux 可执行
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: 打包
        run: |
          python -m PyInstaller --onefile --console --name TrafficProbe \
            --add-data "assets:assets" \
            --add-data "report_html.py:." \
            --add-data "tray.py:." \
            --add-data "tray_win.py:." \
            --distpath dist --workpath build --specpath build \
            traffic_probe.py
      - name: 冒烟测试
        run: |
          chmod +x dist/TrafficProbe
          ./dist/TrafficProbe --help | head -20
      - name: 打包成 tar.gz
        run: tar -czf TrafficProbe-linux.tar.gz -C dist TrafficProbe
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficProbe-linux
          path: TrafficProbe-linux.tar.gz
          if-no-files-found: error

  release:
    name: 发布到 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 收集产物
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.exe" -o -name "*.tar.gz" \) -exec cp {} out/ \;
          ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
